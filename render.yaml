services:
  - type: web
    name: report-app
    runtime: docker
    branch: main
    rootDir: backend
    healthCheckPath: /health/persistence
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://dnkreport.netlify.app
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_8hWkjZvJTm4K@ep-round-silence-zaopxyk0-pooler.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: MIGRATION_DATABASE_URL
        value: postgresql://neondb_owner:npg_8hWkjZvJTm4K@ep-round-silence-zaopxyk0.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: REPORT_STORAGE_ROOT
        value: /var/data/report-app-storage
      - key: REDIS_URL
        fromService:
          type: redis
          name: report-app-redis
          property: connectionString
    disk:
      name: report-app-storage
      mountPath: /var/data
      sizeGB: 1

  - type: redis
    name: report-app-redis
    ipAllowList: [] # Only allow internal connections
    plan: free

  - type: worker
    name: report-app-worker
    runtime: docker
    branch: main
    rootDir: backend
    dockerCommand: python -m rq worker --url $REDIS_URL
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_8hWkjZvJTm4K@ep-round-silence-zaopxyk0-pooler.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: MIGRATION_DATABASE_URL
        value: postgresql://neondb_owner:npg_8hWkjZvJTm4K@ep-round-silence-zaopxyk0.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: REPORT_STORAGE_ROOT
        value: /var/data/report-app-storage
      - key: REDIS_URL
        fromService:
          type: redis
          name: report-app-redis
          property: connectionString
    disk:
      name: report-app-storage
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: report-app-cleanup
    runtime: docker
    branch: main
    rootDir: backend
    schedule: "0 0 * * *"
    dockerCommand: python -m scripts.run_cleanup
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_8hWkjZvJTm4K@ep-round-silence-zaopxyk0-pooler.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: MIGRATION_DATABASE_URL
        value: postgresql://neondb_owner:npg_8hWkjZvJTm4K@ep-round-silence-zaopxyk0.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: REPORT_STORAGE_ROOT
        value: /var/data/report-app-storage
    disk:
      name: report-app-storage
      mountPath: /var/data
      sizeGB: 1

