services:
  - type: web
    name: report-app
    runtime: docker
    branch: main
    rootDir: backend
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://dnkreport.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: report-app-db
          property: connectionString
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: REPORT_STORAGE_ROOT
        value: /var/data/report-app-storage
    disk:
      name: report-app-storage
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: report-app-db
    databaseName: report_app_db
    user: report_app_user
