services:
  - type: web
    name: report-app
    runtime: docker
    branch: main
    rootDir: backend
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://your-frontend.example
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: REPORT_STORAGE_ROOT
        value: /var/data/report-app-storage
    disk:
      name: report-app-storage
      mountPath: /var/data
      sizeGB: 1
